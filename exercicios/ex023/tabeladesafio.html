<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabela</title>
</head>
<style>
    table {
        border-collapse: collapse;
    }
    th, td {
        border: 1px solid black;
        padding: 10px;
    }

    thead, th, .dado {
        background-color: gray;
        color: white;
    }
</style>
<body>
    <table>
       <thead>
           <tr>
               <th rowspan="2">Area</th>
               <th rowspan="2">disciplinas</th>
               <th colspan="2">notas</th>
               <th rowspan="2">media</th>
           </tr>
           <tr>
               <th>Nota 1</th>
               <th>Nota 2</th>
           </tr>
       </thead>
       <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matematica</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <td>Fisica</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <td>Quimica</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
             <tr>
                <td>Biologia</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <th colspan=" 4">Media Exatas</th>
                <td class="dado">0.00</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>Historia</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
             <tr>
                <td>Geografia</td>
                <td>0.00</td>
                <td>0.00</td>
                <td>0.00</td>
            </tr>
            <tr>
                <th colspan="4">Media Humanas</th>
                <td class="dado">0.00</td>
            </tr>
       </tbody>
    </table>
</body>
</html>
